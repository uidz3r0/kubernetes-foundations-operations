# This is your "mini CKA".
apiVersion: v1
kind: Pod
metadata:
  name: final-app
  labels:
    app: website
spec:
  containers:
  - name: nginx
    image: nginx:9999

    volumeMounts:
    - name: storage
      mountPath: /usr/share/nginx/html

  volumes:
  - name: storage
    persistentVolumeClaim:
      claimName: website-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: website-service
spec:
  selector:
    app: web

  ports:
  - port: 80
    targetPort: 8080