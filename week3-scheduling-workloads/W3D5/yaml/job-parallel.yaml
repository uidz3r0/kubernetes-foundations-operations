apiVersion: batch/v1
kind: Job
metadata:
  name: parallel-job

spec:
  completions: 6
  parallelism: 3

  template:
    spec:
      restartPolicy: Never

      containers:
      - name: worker
        image: busybox
        command:
        - sh
        - -c
        - |
          echo "Processing batch"
          sleep 15