apiVersion: apps/v1
kind: Deployment
metadata:
  name: hpa-demo

spec:
  replicas: 1

  selector:
    matchLabels:
      app: hpa-demo

  template:
    metadata:
      labels:
        app: hpa-demo

    spec:
      containers:
        - name: nginx
          image: nginx

          resources:
            requests:
              cpu: 100m
              memory: 64Mi

            limits:
              cpu: 500m
              memory: 128Mi
              