apiVersion: apps/v1
kind: Deployment

metadata:
  name: platform-demo

spec:
  replicas: 3

  selector:
    matchLabels:
      app: platform-demo

  template:
    metadata:
      labels:
        app: platform-demo

    spec:
      serviceAccountName: developer-sa

      containers:
      - name: nginx
        image: nginx:1.30