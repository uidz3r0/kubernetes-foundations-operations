# Represents a Git commit changing the desired state.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitops-demo
spec:
  replicas: 4

  selector:
    matchLabels:
      app: gitops-demo

  template:
    metadata:
      labels:
        app: gitops-demo

    spec:
      containers:
      - name: nginx
        image: nginx:1.28
        ports:
        - containerPort: 80