apiVersion: v1
kind: Pod
metadata:
  name: env-secret-demo
spec:
  containers:
  - name: alpine
    image: alpine:3.20
    command: ["sh","-c","sleep 3600"]
    env:
    - name: USERNAME
      valueFrom:
        secretKeyRef:
          name: db-secret
          key: username
    - name: PASSWORD
      valueFrom:
        secretKeyRef:
          name: db-secret
          key: password