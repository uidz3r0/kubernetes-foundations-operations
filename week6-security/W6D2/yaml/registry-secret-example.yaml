apiVersion: v1
kind: Pod
metadata:
  name: private-image
spec:
  imagePullSecrets:
  - name: regcred
  containers:
  - name: app
    image: myregistry.example.com/private/app:latest

# Note: This is an illustrative example. Without creating a matching `regcred` Secret 
# and having access to the private registry, the Pod will fail with ImagePullBackOff.
